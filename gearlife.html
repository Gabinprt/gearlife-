<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#138a4c">
<meta name="color-scheme" content="only light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gearlife">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Gearlife</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23138a4c'/%3E%3Cpath d='M50 20 78 34v32L50 80 22 66V34z' fill='none' stroke='white' stroke-width='6' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
html{background:#f1f4ee}
:root{
  color-scheme:only light;
  --bg:#f1f4ee; --card:#fff; --ink:#13241b; --mute:#5f7068; --line:#dfe6dc;
  --green:#138a4c; --green-d:#0d6b3a; --green-l:#dff3e5; --green-xl:#f3fbf5;
  --amber:#c9740a; --amber-l:#fdeed8; --red:#c0392b; --red-l:#fde8e6;
  --blue-l:#e4e8fb; --blue:#4a5bc4; --violet-l:#f1e4f6; --violet:#8a3fa6;
  --radius:18px;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overscroll-behavior:none}
@supports (height:100dvh){html,body{height:100dvh}}
body{-webkit-text-size-adjust:100%;touch-action:manipulation}
input,select,textarea{font-size:16px}
body{background:#cfd8cb;color:var(--ink);font-family:"Inter","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;display:flex;justify-content:center}

#app{position:relative;width:100%;max-width:440px;height:100%;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
@media (min-width:480px){#app{height:min(900px,100vh);margin:auto;border-radius:28px;box-shadow:0 20px 60px rgba(0,0,0,.25)}body{align-items:center}}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.scroll{flex:1;overflow-y:auto;padding-bottom:24px;-webkit-overflow-scrolling:touch}
.pad{padding:0 18px}
h1,h2,h3{margin:0}

/* Tab bar */
nav{display:flex;background:var(--card);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--mute);padding:4px 0}
nav button svg{width:23px;height:23px}
nav button.on{color:var(--green)}

/* Headers */
.hero{background:linear-gradient(135deg,#0f8044,#1fae63);color:#fff;padding:calc(26px + env(safe-area-inset-top,0px)) 20px 26px;position:relative}
.hero small{display:block;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;opacity:.85}
.hero h1{font-size:27px;margin:8px 0 6px;line-height:1.12}
.hero p{margin:0;font-size:14px;opacity:.92}
.bell{position:absolute;right:18px;top:calc(22px + env(safe-area-inset-top,0px));width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;color:#fff}
.bell i{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:#ff6a4d;border:2px solid #17a05a}
.bell svg{width:20px;height:20px}
.pagehead{padding:calc(22px + env(safe-area-inset-top,0px)) 18px 6px}
.pagehead .eyebrow{font-size:11.5px;color:var(--green);font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.pagehead h1{font-size:28px;margin-top:4px;line-height:1.1}
.pagehead p{color:var(--mute);font-size:13.5px;margin:8px 0 0}
.prep-head{background:linear-gradient(180deg,#dff3e5,transparent);}

/* Stats */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px 18px 4px}
.stat{background:var(--card);border-radius:var(--radius);padding:14px;box-shadow:0 1px 0 var(--line)}
.stat.hl{background:var(--green-l)}
button.stat{text-align:left;width:100%;border:0;display:block}
.stat .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;margin-bottom:10px;background:var(--card)}
.stat .ic svg{width:18px;height:18px}
.stat b{display:block;font-size:26px;line-height:1}
.stat span{font-size:12.5px;color:var(--mute)}
.stat.hl b{color:var(--green)}

.sect{font-size:18px;font-weight:800;margin:22px 18px 10px}
.empty{background:var(--card);border-radius:22px;margin:0 18px;padding:30px 22px;text-align:center}
.empty .big{width:58px;height:58px;border-radius:50%;background:var(--green-l);color:var(--green);display:grid;place-items:center;margin:0 auto 16px}
.empty .big svg{width:26px;height:26px}
.empty h3{font-size:16px}
.empty p{color:var(--mute);font-size:13.5px;margin:8px 0 20px;line-height:1.45}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--green);color:#fff;font-weight:700;font-size:15px;padding:15px;border-radius:15px}
.btn:active{background:var(--green-d)}
.btn[disabled]{background:#8fc8a8;cursor:not-allowed}
.btn.ghost{background:var(--green-l);color:var(--green)}
.btn.danger{background:var(--red-l);color:var(--red)}
.btn svg{width:18px;height:18px}

.quick{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 18px}
.quick button{background:var(--card);border-radius:var(--radius);padding:14px;text-align:left}
.quick .ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;margin-bottom:12px}
.quick .ic svg{width:18px;height:18px}
.quick b{display:block;font-size:14px}.quick span{font-size:12px;color:var(--mute)}

/* Item list */
.search{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 14px;margin:14px 18px 12px}
.search svg{width:18px;height:18px;color:var(--mute)}
.search input{font-size:16px;flex:1;border:0;background:none;padding:13px 0;font:inherit;color:var(--ink);outline:none}
.search:focus-within{border-color:var(--ink)}
.chips{display:flex;gap:8px;padding:0 18px;overflow-x:auto}
.chip{padding:8px 16px;border-radius:999px;background:var(--green-l);color:var(--mute);font-size:13px;font-weight:700;white-space:nowrap}
.chip.on{background:var(--green);color:#fff}
.count{font-size:12px;color:var(--mute);padding:12px 18px 4px}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:16px;margin:10px 18px 0;padding:13px;width:calc(100% - 36px);text-align:left}
.item .ico{width:44px;height:44px;border-radius:13px;background:var(--green-l);color:var(--green);display:grid;place-items:center;flex:none}
.item .ico svg{width:22px;height:22px}
.item .mid{flex:1;min-width:0}
.item b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item small{color:var(--mute);font-size:12px}
.bar{height:7px;background:var(--line);border-radius:9px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:9px}
.bar.warn i{background:var(--amber)}.bar.bad i{background:var(--red)}
.pct{font-weight:800;font-size:13px;color:var(--green)}
.pct.warn{color:var(--amber)}.pct.bad{color:var(--red)}
.fab{position:absolute;right:18px;top:calc(22px + env(safe-area-inset-top,0px));width:46px;height:46px;border-radius:14px;background:var(--green);color:#fff;display:grid;place-items:center}
.fab svg{width:22px;height:22px}
.star{color:var(--amber)}

/* Forms */
.topbar{display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 8px}
.back{width:40px;height:40px;border-radius:12px;background:var(--card);display:grid;place-items:center}
.back svg{width:20px;height:20px}
.topbar h2{flex:1;text-align:center;font-size:17px;margin-right:40px}
.lbl{display:block;font-size:11.5px;font-weight:800;color:var(--mute);letter-spacing:.07em;text-transform:uppercase;margin:20px 0 8px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg.c4{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;background:var(--card);border:1.5px solid transparent;border-radius:14px;padding:16px 10px;font-size:12.5px;font-weight:700;color:var(--mute)}
.opt.row{flex-direction:row;justify-content:flex-start;gap:10px;padding:10px;font-size:13px}
.opt .ci{width:34px;height:34px;border-radius:50%;background:var(--line);display:grid;place-items:center}
.opt svg{width:18px;height:18px}
.opt.on{border-color:var(--green);background:var(--green-xl);color:var(--green-d)}
.opt.on .ci{background:var(--green-l);color:var(--green)}
.field{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px;font:inherit;color:var(--ink)}
.field::placeholder{color:#a3b0a8}
.field:focus{border-color:var(--ink);outline:none}
.hint{font-size:12px;color:var(--mute);margin-top:6px}
.sticky{padding:18px}

/* Détail */
.detail-hero{display:flex;gap:14px;align-items:center;padding:6px 18px 0}
.detail-hero .ico{width:60px;height:60px;border-radius:18px;background:var(--green-l);color:var(--green);display:grid;place-items:center}
.detail-hero .ico svg{width:30px;height:30px}
.detail-hero h3{font-size:20px}
.detail-hero small{color:var(--mute)}
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin:14px 18px 0}
.card .row{display:flex;justify-content:space-between;font-size:14px;padding:8px 0;border-bottom:1px solid var(--line)}
.card .row:last-child{border:0}
.card .row span{color:var(--mute)}
.bigbar{height:12px}
.tools{display:flex;gap:10px;margin:14px 18px 0}
.tools .btn{padding:13px;font-size:14px}

/* Préparer */
.checks label{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:14px;padding:13px;margin:8px 18px 0;cursor:pointer}
.checks input{width:20px;height:20px;accent-color:var(--green)}
.checks .mid{flex:1}
.checks b{display:block;font-size:14px}.checks small{color:var(--mute);font-size:12px}
.tag{font-size:11px;font-weight:800;padding:3px 8px;border-radius:8px;background:var(--amber-l);color:var(--amber)}

/* Profil */
.me{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:var(--radius);padding:14px;margin:14px 18px 0}
.avatar{width:58px;height:58px;border-radius:16px;background:var(--green-l);color:var(--green);display:grid;place-items:center;font-size:24px;font-weight:800;flex:none}
.me .inputs{flex:1;min-width:0}
.me input{width:100%;border:0;background:none;font:inherit;color:var(--ink);padding:3px 0;outline:none}
.me input.n{font-weight:800;font-size:18px}
.me input.s{font-size:16px;color:var(--mute)}
.me .pulse{width:40px;height:40px;border-radius:12px;background:var(--green);color:#fff;display:grid;place-items:center;flex:none}
.me .pulse svg{width:20px;height:20px}
.grp{font-size:11.5px;font-weight:800;color:var(--mute);letter-spacing:.07em;text-transform:uppercase;margin:24px 18px 10px}
.pref{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:13px;margin:0 18px}
.pref .ic{width:38px;height:38px;border-radius:50%;background:var(--amber-l);color:var(--amber);display:grid;place-items:center}
.pref .ic svg{width:18px;height:18px}
.pref div.t{flex:1}.pref b{display:block;font-size:14px}.pref small{color:var(--mute);font-size:12px}
.sw{width:46px;height:28px;border-radius:99px;background:#b9c6bd;position:relative;transition:.2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--green)}.sw.on::after{left:21px}
.park{display:flex;background:var(--green-l);border-radius:var(--radius);padding:16px 0;margin:0 18px}
.park div{flex:1;text-align:center;border-left:1px solid rgba(19,138,76,.2)}
.park div:first-child{border:0}
.park b{display:block;font-size:19px;color:var(--green)}.park span{font-size:12px;color:var(--mute)}
.line{display:flex;align-items:center;gap:12px;width:calc(100% - 36px);margin:12px 18px 0;background:var(--card);border-radius:14px;padding:14px;font-weight:700;font-size:14px;text-align:left}
.line svg{width:18px;height:18px;color:var(--green)}.line .ch{margin-left:auto;color:var(--mute)}
.line.red{background:var(--red-l);color:var(--red)}.line.red svg{color:var(--red)}
.foot{text-align:center;color:var(--mute);font-size:12px;margin:18px 0}
.about{margin:10px 18px 0;background:var(--card);border-radius:14px;padding:14px;font-size:13.5px;color:var(--mute);line-height:1.5}

/* Toast */
#toast{overflow:hidden;text-overflow:ellipsis;position:absolute;left:50%;bottom:88px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;white-space:nowrap;max-width:90%}
#toast.show{opacity:1;transform:translate(-50%,0)}
.ios-tip{position:absolute;left:12px;right:12px;bottom:calc(78px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 12px 12px 14px;font-size:13.5px;line-height:1.4;display:flex;gap:10px;align-items:center;z-index:6;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.ios-tip b{font-weight:800}.ios-tip button{flex:none;font-weight:800;background:rgba(255,255,255,.18);color:inherit;border-radius:10px;padding:8px 12px}
.modal-bg{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:24px;z-index:20}
.modal{background:var(--card);border-radius:22px;padding:22px 20px 18px;width:100%;max-width:340px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal .mi{width:52px;height:52px;border-radius:50%;background:var(--red-l);color:var(--red);display:grid;place-items:center;margin:0 auto 14px}
.modal .mi svg{width:24px;height:24px}
.modal h3{font-size:17px}
.modal p{color:var(--mute);font-size:14px;line-height:1.45;margin:8px 0 18px;overflow-wrap:anywhere}
.modal .acts{display:flex;gap:10px}
.modal .acts .btn{padding:13px;font-size:14.5px}
.btn.red{background:var(--red);color:#fff}
button.bell{border:0;padding:0;cursor:pointer}
.alerts{position:absolute;right:14px;top:calc(70px + env(safe-area-inset-top,0px));width:min(310px,calc(100% - 28px));background:var(--card);color:var(--ink);border-radius:16px;box-shadow:0 12px 34px rgba(0,0,0,.28);padding:10px;z-index:8}
.alerts .ah{font-size:11.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);padding:4px 6px 8px}
.alerts .am{margin:0;padding:4px 6px 8px;font-size:13.5px;color:var(--mute);line-height:1.4}
.arow{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:10px 6px;border-radius:12px}
.arow:active{background:var(--green-xl)}
.arow .aic{width:34px;height:34px;border-radius:50%;background:var(--amber-l);color:var(--amber);display:grid;place-items:center;flex:none}
.arow .aic svg{width:17px;height:17px}
.hero .arow small{text-transform:none;letter-spacing:0;font-weight:500;opacity:1;display:block;font-size:12.5px;color:var(--mute)}
.arow b{display:block;font-size:14px;overflow-wrap:anywhere}.arow small{font-size:12.5px;color:var(--mute)}
.plus{width:30px;height:30px;border-radius:50%;background:var(--green-l);color:var(--green);display:grid;place-items:center;flex:none}
.plus svg{width:16px;height:16px}.plus:active{background:var(--green);color:#fff}
.modal .mi.ok{background:var(--green-l);color:var(--green)}
.modal p.tight{margin-bottom:14px}
.qchips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0 18px}
.qchips .chip{padding:7px 14px}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div id="view" class="scroll" role="main"></div>
  <nav id="tabs" aria-label="Navigation principale"></nav>
  <div id="toast" role="status" aria-live="polite"></div>
</div>

<script>
/* ---------- Icônes ---------- */
const P={
 home:'<path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 box:'<path d="M12 3 20 7.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5 12 12l8-4.5M12 12v9"/>',
 send:'<path d="M21 3 10 14M21 3l-7 18-4-7-7-4z"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 layers:'<path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/><path d="m3 17.5 9 5 9-5" opacity=".0"/>',
 alert:'<path d="M12 3 2.5 20h19z"/><path d="M12 10v5M12 17.5v.5"/>',
 wallet:'<path d="M4 7a2 2 0 0 1 2-2h12v4"/><rect x="3" y="7" width="18" height="13" rx="3"/><circle cx="16.5" cy="13.5" r="1.2"/>',
 bell:'<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/>',
 shoe:'<circle cx="8" cy="8" r="2"/><circle cx="14" cy="6" r="1.6"/><path d="M5 14c-1.2 0-2 .8-2 2s1 2.5 2.5 2.5S9 17 9 15.5 6.2 14 5 14zM13 17c-1.3 0-2 .9-2 2s1 2.3 2.4 2.3 2.6-1.2 2.6-2.4S14.3 17 13 17z" opacity="0"/><path d="M4 16c0-3 2-5 4-6l3 2c1 .7 2.5 1 4 1l4 2c1 .5 1 2-.5 2H5z"/>',
 shirt:'<path d="m8 4-5 3 2 4 2-1v10h10V10l2 1 2-4-5-3c-.5 1.5-2 2.3-4 2.3S8.5 5.5 8 4z"/>',
 bag:'<rect x="3" y="8" width="18" height="12" rx="3"/><path d="M9 8V6a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 14h18"/>',
 apple:'<path d="M12 8c-2-1.5-6-1-6 4 0 4 2.5 8 4.5 8 1 0 1-.6 1.5-.6s.5.6 1.5.6c2 0 4.500-4 4.500-8 0-5-4-5.500-6-4z"/><path d="M12 8c0-2 1-3.500 3-4"/>',
 search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',
 back:'<path d="M19 12H5M11 6l-6 6 6 6"/>',
 check:'<path d="m5 12.500 4.500 4.500L19 7.500"/>',
 pulse:'<path d="M3 12h4l3-7 4 14 3-7h4"/>',
 info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.5"/>',
 reset:'<path d="M3 12a9 9 0 1 0 3-6.700L3 8"/><path d="M3 3v5h5"/>',
 chev:'<path d="m9 6 6 6-6 6"/>',
 star:'<path d="m12 3 2.700 5.600 6.100.9-4.400 4.300 1 6.100L12 17l-5.400 2.900 1-6.100L3.200 9.500l6.100-.9z"/>',
 undo:'<path d="M9 14 4 9l5-5"/><path d="M4 9h10.500a5.500 5.500 0 0 1 0 11H11"/>',
 trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>'
};
const ic=(n,f)=>`<svg viewBox="0 0 24 24" fill="${f?'currentColor':'none'}" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;

/* ---------- Données ---------- */
const KEY='gearflow.v1';
const CATS={chaussures:{l:'Chaussures',i:'shoe'},vetement:{l:'Vêtement',i:'shirt'},sac:{l:'Sac',i:'bag'},nutrition:{l:'Nutrition',i:'apple'}};
const DEF={items:[],profile:{name:'',sport:''},alerts:true};
let S=load();
function load(){try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);return Object.assign({},DEF,d,{items:d.items||[],profile:Object.assign({},DEF.profile,d.profile)})}}catch(e){}return JSON.parse(JSON.stringify(DEF))}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:2}).format(n||0);
const wear=i=>i.type==='equipement'?Math.min(100,Math.round((i.used||0)/Math.max(1,i.life)*100)):null;
const lvl=p=>p>=100?'bad':p>=80?'warn':'';
const equip=()=>S.items.filter(i=>i.type==='equipement');
const conso=()=>S.items.filter(i=>i.type==='consommable');
const qMax=i=>Math.max(i.qtyMax||0,i.qty||0,1);
const low=i=>i.type==='equipement'?(i.used||0)/Math.max(1,i.life)>0.7:(i.qty||0)<qMax(i)*0.3;
const watch=()=>S.items.filter(low);
const lifePct=i=>i.type==='equipement'
  ?Math.max(0,Math.min(100,Math.floor(100-(i.used||0)/Math.max(1,i.life)*100)))
  :Math.max(0,Math.min(100,Math.floor((i.qty||0)/qMax(i)*100)));
const barCls=p=>p<=10?'bad':p<30?'warn':'';
const statusOf=i=>i.type==='equipement'
  ?((i.used||0)>=i.life?'À remplacer':low(i)?'À surveiller':'En bon état')
  :((i.qty||0)<=0?'Épuisé':low(i)?'À surveiller':'En bon état');
function addKm(i,km){i.used=(i.used||0)+km;(i.log=i.log||[]).push({t:Date.now(),km});if(i.log.length>50)i.log.splice(0,i.log.length-50)}


/* ---------- État UI ---------- */
let tab='home', screen=null, filter='all', q='', form=null, detailId=null, prep=null, aboutOpen=false;
const $=s=>document.querySelector(s);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2200)}
function go(t,s=null){tab=t;screen=s;bellOpen=false;render();$('#view').scrollTop=0}


let bellOpen=false;
const seenMap=()=>S.seen||(S.seen={});
function alertList(){
  return equip().map(i=>({i,r:(i.used||0)/Math.max(1,i.life)})).filter(a=>a.r>=0.8)
    .sort((a,b)=>b.r-a.r).map(a=>({i:a.i,pct:Math.min(100,Math.round(a.r*100)),key:a.i.id+(a.r>=1?':100':':80')}));
}
const alertKeys=()=>new Set(alertList().map(a=>a.key));
function notifyNew(before){
  if(!S.alerts)return;
  const n=alertList().filter(a=>!before.has(a.key));
  if(n.length){const a=n[0];toast(a.pct>=100?`Alerte : ${a.i.name} est à 100 %`:`Alerte : ${a.i.name} a atteint ${a.pct} %`)}
}
function alertPanel(al){
  const body=!S.alerts?'<p class="am">Les alertes d’usure sont désactivées. Tu peux les réactiver dans Profil.</p>'
    :al.length?al.map(a=>`<button class="arow" data-open="${a.i.id}"><span class="aic">${ic('alert')}</span><span><b>${esc(a.i.name)}</b><small>${a.pct>=100?'À remplacer : 100 % de sa durée de vie':`A atteint ${a.pct} % de sa durée de vie`}</small></span></button>`).join('')
    :'<p class="am">Aucune alerte pour le moment.</p>';
  return `<div class="alerts" role="dialog" aria-label="Alertes d’usure"><div class="ah">Alertes d’usure</div>${body}</div>`;
}
document.addEventListener('click',e=>{if(bellOpen&&!e.target.closest('.alerts')&&!e.target.closest('[data-bell]')){bellOpen=false;render()}});
/* ---------- Rendu ---------- */
function render(){
  $('#tabs').classList.toggle('hidden',screen==='add'||screen==='detail');
  $('#tabs').innerHTML=[['home','home','Accueil'],['stock','box','Matériel'],['prep','send','Préparer'],['me','user','Profil']]
    .map(([k,i,l])=>`<button class="${tab===k?'on':''}" data-tab="${k}" aria-label="${l}" ${tab===k?'aria-current="page"':''}>${ic(i)}${l}</button>`).join('');
  $('#tabs').querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{if(b.dataset.tab==='stock'&&filter==='watch')filter='all';go(b.dataset.tab)});
  const v=$('#view');
  v.innerHTML = screen==='add'?addView() : screen==='detail'?detailView() : ({home:homeView,stock:stockView,prep:prepView,me:meView})[tab]();
  bind();
}

function itemRow(i){
  const p=lifePct(i);
  return `<button class="item" data-open="${i.id}" aria-label="${esc(i.name)}, ${p} % de vie restante">
    <div class="ico">${ic(CATS[i.cat].i)}</div>
    <div class="mid"><b>${esc(i.name)}${i.fav?` <span class="star">${ic('star',1).replace('<svg','<svg width="12" height="12"')}</span>`:''}</b>
      <div class="bar ${barCls(p)}" role="progressbar" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100"><i style="width:${p}%"></i></div></div>
  </button>`;
}

  const name=S.profile.name.trim();
  const e=equip(), w=watch();
  const al=alertList(), unread=S.alerts&&al.some(a=>!seenMap()[a.key]);
  const val=S.items.reduce((s,i)=>s+(Number(i.price)||0)*(i.type==='consommable'?(i.qty||1):1),0);
  const garage=S.items.length===0
    ?`<div class="empty"><div class="big">${ic('box')}</div><h3>Ton inventaire est vide</h3><p>Ajoute tes chaussures, ton sac ou tes consommables pour commencer à suivre leur durée de vie.</p><button class="btn" data-go="add">${ic('plus')} Ajouter mon premier équipement</button></div>`
    :[...S.items].sort((a,b)=>(wear(b)??-1)-(wear(a)??-1)).slice(0,4).map(itemRow).join('')
     +(S.items.length>4?`<button class="line" data-tab="stock" style="margin-top:12px">Voir tout le matériel <span class="ch">${ic('chev')}</span></button>`:'');
  return `<header class="hero"><small>Tableau de bord</small>
    <h1>${name?`Salut ${esc(name)} !`:'Bienvenue dans Gearlife'}</h1>

    <button class="bell" data-bell aria-label="Alertes${unread?' (nouvelles)':''}" aria-expanded="${bellOpen}">${ic('bell')}${unread?'<i></i>':''}</button>${bellOpen?alertPanel(al):''}</header>
  <div class="grid2">
    <div class="stat hl"><div class="ic" style="color:var(--green)">${ic('box')}</div><b>${e.length}</b><span>équipements suivis</span></div>
    <button class="stat" data-watch aria-label="Voir le matériel à surveiller"><div class="ic" style="background:var(--amber-l);color:var(--amber)">${ic('alert')}</div><b>${w.length}</b><span>à surveiller</span></button>
    <div class="stat"><div class="ic" style="background:var(--blue-l);color:var(--blue)">${ic('layers')}</div><b>${conso().length}</b><span>consommables</span></div>
    <div class="stat"><div class="ic" style="background:var(--violet-l);color:var(--violet)">${ic('wallet')}</div><b>${eur(val)}</b><span>valeur du parc</span></div>
  </div>

  <div class="quick">
    <button data-go="add"><div class="ic" style="background:var(--green-l);color:var(--green)">${ic('plus')}</div><b>Ajouter du matériel</b><span>Équipement ou stock</span></button>

function stockView(){
  let list=S.items.filter(i=>(filter==='all'||(filter==='equipement'&&i.type==='equipement')||(filter==='consommable'&&i.type==='consommable')||(filter==='watch'&&low(i)))
    &&(!q||(i.name+' '+(i.brand||'')+' '+CATS[i.cat].l).toLowerCase().includes(q.toLowerCase())));

    :`<div class="empty" style="margin-top:34px;background:none"><div class="big">${ic('box')}</div><h3>${filter==='watch'&&!q?'Rien à surveiller':'Aucun élément trouvé'}</h3><p>${filter==='watch'&&!q?'Rien à surveiller pour le moment : tout ton matériel est en bon état.':S.items.length?'Essaie un autre mot-clé ou un autre filtre.':'Essaie un autre mot-clé ou ajoute ton premier équipement.'}</p></div>`;

function detailView(){
  const i=S.items.find(x=>x.id===detailId); if(!i){screen=null;return stockView()}
  const eq=i.type==='equipement', p=lifePct(i), cls=barCls(p), st=statusOf(i);
  const fd=d=>d?new Date(d).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'}):'—';
  const buy=i.date?new Date(i.date+'T00:00'):null;
  const days=buy?Math.max(0,Math.floor((Date.now()-buy.getTime())/864e5)):null;
  const age=days===null?'—':days<1?'Aujourd’hui':days<31?`${days} jour${days>1?'s':''}`:days<365?`${Math.floor(days/30)} mois`:(()=>{const y=(days/365).toFixed(1).replace('.',',');return `${y} ${days>=730?'ans':'an'}`})();
  const num=n=>new Intl.NumberFormat('fr-FR',{maximumFractionDigits:1}).format(n);
  const rows=[['Catégorie',CATS[i.cat].l],['Marque',i.brand||'—'],['Date d’achat',fd(i.date)],['Ancienneté',age]];
  let hint='';
  if(eq){
    const used=i.used||0,left=Math.max(0,i.life-used),rate=days&&days>=30&&used>0?used/(days/30):0;
    hint=`${num(left)} km restants sur ${num(i.life)} km`;
    rows.push(['Prix',i.price?eur(i.price):'—'],['Coût par km',i.price&&i.life>0?(v=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',minimumFractionDigits:2,maximumFractionDigits:v<1?3:2}).format(v)+' / km')(i.price/i.life):'—'],
      ['Durée de vie estimée',num(i.life)+' km'],['Km parcourus',num(used)+' km'],['Km restants',num(left)+' km']);
    if(rate>0)rows.push(['Rythme moyen',num(rate)+' km / mois'],['Durée restante estimée',left<=0?'Terminée':(m=>m>60?'Plus de 5 ans':'≈ '+m+' mois')(Math.max(1,Math.round(left/rate)))]);
  }else{
    hint=`${i.qty} restant${i.qty>1?'s':''} sur ${qMax(i)}`;
    rows.push(['Prix à l’unité',i.price?eur(i.price):'—'],['Valeur du stock',i.price?eur(i.price*i.qty):'—'],
      ['Stock actuel',String(i.qty)],['Stock de départ',String(qMax(i))]);
  }
  rows.push(['Type',eq?'Équipement':'Consommable'],['Favori',i.fav?'Oui':'Non'],['Ajouté le',i.added?fd(i.added):'—']);
  const log=eq?(i.log||[]).slice(-6).reverse():[];
  return `<div class="topbar"><button class="back" data-back aria-label="Retour">${ic('back')}</button><h2>${esc(i.name)}</h2></div>
  <div class="detail-hero"><div class="ico">${ic(CATS[i.cat].i)}</div><div><h3>${esc(i.name)}</h3><small>${esc(i.brand||'Marque non renseignée')} · ${CATS[i.cat].l}</small></div></div>
  <div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><span style="font-weight:800">Barre de vie</span><span style="display:flex;align-items:center;gap:10px"><span class="pct ${cls}" style="font-size:22px">${p} %</span>${eq?`<button class="plus" data-giveback aria-label="Rajouter des km (annuler des km retirés)">${ic('undo')}</button>`:''}</span></div>
    <div class="bar bigbar ${cls}" role="progressbar" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100"><i style="width:${p}%"></i></div>
    <div style="display:flex;justify-content:space-between;gap:10px;margin-top:10px"><b class="pct ${cls}">${st}</b><span class="hint" style="margin:0">${hint}</span></div></div>
  ${eq?`<div class="tools"><button class="btn ghost" data-km="5">+5 km</button><button class="btn ghost" data-km="10">+10 km</button><button class="btn ghost" data-km="20">+20 km</button></div>`
  :`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;font-weight:800"><span>Stock</span>
    <span style="display:flex;gap:14px;align-items:center"><button class="back" data-qty="-1" aria-label="Retirer un">−</button><span style="font-size:20px">${i.qty}</span><button class="back" data-qty="1" aria-label="Ajouter un">+</button></span></div></div>`}
  <h2 class="sect" style="font-size:16px;margin-top:20px">Informations</h2>
  <div class="card" style="margin-top:0">${rows.map(([a,b])=>`<div class="row"><span>${a}</span><b>${esc(b)}</b></div>`).join('')}</div>
  ${log.length?`<h2 class="sect" style="font-size:16px;margin-top:20px">Dernières sorties</h2><div class="card" style="margin-top:0">${log.map(l=>`<div class="row"><span>${new Date(l.t).toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'})}</span><b>${l.km<0?'−':'+'}${num(Math.abs(l.km))} km</b></div>`).join('')}</div>`:''}
  <div class="tools"><button class="btn ghost" data-fav>${ic('star',i.fav)} ${i.fav?'Retirer des favoris':'Mettre en favori'}</button></div>
  <div class="tools"><button class="btn danger" data-del>${ic('trash')} Supprimer</button></div>`;
}

function prepView(){
  const e=equip(), c=conso();
  const head=`<div class="pagehead prep-head"><div class="eyebrow">Avant de partir</div><h1>Prépare ta sortie</h1><p>Le bon équipement, au bon moment. Gearlife s’occupe du reste.</p></div>`;
  if(!S.items.length) return head+`<div class="empty" style="margin-top:22px"><div class="big">${ic('box')}</div><h3>Ajoute du matériel avant de partir</h3><p>Gearlife pourra ensuite te proposer une sélection adaptée à chaque sortie.</p><button class="btn" data-go="add">${ic('plus')} Ajouter mon matériel</button></div>`;
  if(!prep||prep.stale){ // sélection par défaut : tout l'équipement non usé + consommables en stock
    prep={km:10,sel:new Set([...e.filter(i=>wear(i)<100).map(i=>i.id),...c.filter(i=>i.qty>0).map(i=>i.id)])};
  }
  const row=i=>{const w=wear(i);return `<label><input type="checkbox" data-sel="${i.id}" ${prep.sel.has(i.id)?'checked':''}>
    <div class="mid"><b>${esc(i.name)}</b><small>${esc(i.brand||CATS[i.cat].l)}${i.type==='consommable'?` · ${i.qty} en stock`:` · ${w}% d’usure`}</small></div>
    ${w>=80?`<span class="tag">${w>=100?'À remplacer':'Usé'}</span>`:''}</label>`};
  return head+`<span class="lbl" style="margin:16px 18px 8px">Distance prévue (km)</span>
  <div style="padding:0 18px"><input class="field" id="p-km" type="number" min="1" inputmode="numeric" value="${prep.km}"></div>
  ${e.length?`<h2 class="sect">Équipement</h2><div class="checks">${e.map(row).join('')}</div>`:''}
  ${c.length?`<h2 class="sect">Consommables</h2><div class="checks">${c.map(row).join('')}</div>`:''}
  <div class="sticky"><button class="btn" id="finish">${ic('check')} Terminer la sortie</button>
  <div class="hint" style="text-align:center;margin-top:8px">Ajoute la distance à l’équipement coché et retire 1 consommable coché du stock.</div></div>`;
}

function askConfirm(title,text,okLabel,onOk){
  const app=document.getElementById('app'), prev=document.activeElement;
  const bg=document.createElement('div');bg.className='modal-bg';
  bg.innerHTML=`<div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="mt"><div class="mi">${ic('trash')}</div><h3 id="mt">${esc(title)}</h3><p>${esc(text)}</p><div class="acts"><button class="btn ghost" data-no>Annuler</button><button class="btn red" data-yes>${esc(okLabel)}</button></div></div>`;
  const close=()=>{bg.remove();document.removeEventListener('keydown',key);if(prev&&prev.focus)try{prev.focus()}catch(e){}};
  const key=e=>{if(e.key==='Escape')close()};
  bg.onclick=e=>{if(e.target===bg)close()};
  bg.querySelector('[data-no]').onclick=close;
  bg.querySelector('[data-yes]').onclick=()=>{close();onOk()};
  document.addEventListener('keydown',key);
  app.appendChild(bg);bg.querySelector('[data-no]').focus();
}

function askNumber(o){
  const app=document.getElementById('app'), prev=document.activeElement;
  const bg=document.createElement('div');bg.className='modal-bg';
  bg.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="mi ok">${ic(o.icon||'plus')}</div><h3 id="mt">${esc(o.title)}</h3><p class="tight">${esc(o.text)}</p>
    <input class="field" id="mnum" type="number" inputmode="numeric" min="1" step="1" placeholder="${esc(o.ph||'Ex. 50')}" value="${esc(o.val||'')}" aria-label="${esc(o.title)}" style="text-align:center;font-weight:700">
    <div class="qchips">${o.chips.map(c=>`<button class="chip" data-c="${c}">${c}${o.unit?' '+o.unit:''}</button>`).join('')}</div>
    <div class="acts"><button class="btn ghost" data-no>Annuler</button><button class="btn" data-yes disabled>${esc(o.ok)}</button></div></div>`;
  const inp=bg.querySelector('#mnum'), yes=bg.querySelector('[data-yes]');
  const val=()=>{const n=Number(inp.value);return Number.isInteger(n)&&n>0&&n<=(o.max||100000)?n:0};
  const sync=()=>{yes.disabled=!val()};
  const close=()=>{bg.remove();document.removeEventListener('keydown',key);if(prev&&prev.focus)try{prev.focus()}catch(e){}};
  const go=()=>{const n=val();if(!n)return;close();o.onOk(n)};
  const key=e=>{if(e.key==='Escape')close();else if(e.key==='Enter'&&document.activeElement===inp)go()};
  inp.oninput=sync;
  bg.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{inp.value=b.dataset.c;sync()});
  bg.onclick=e=>{if(e.target===bg)close()};
  bg.querySelector('[data-no]').onclick=close; yes.onclick=go;
  document.addEventListener('keydown',key);
  app.appendChild(bg);sync();inp.focus();
}
function pruneSeen(){
  equip().forEach(i=>{const r=(i.used||0)/Math.max(1,i.life);if(r<0.8)delete seenMap()[i.id+':80'];if(r<1)delete seenMap()[i.id+':100']});
}
/* ---------- Événements ---------- */
const newForm=()=>({type:'equipement',cat:'chaussures',name:'',brand:'',date:'',price:'',life:'800',qty:'1'});
function bind(){
  const v=$('#view');
  v.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{if(b.dataset.go==='add'){form=newForm();screen='add';render();v.scrollTop=0}});
  v.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>go(b.dataset.tab));
  v.querySelectorAll('[data-bell]').forEach(b=>b.onclick=e=>{e.stopPropagation();bellOpen=!bellOpen;if(bellOpen){alertList().forEach(a=>seenMap()[a.key]=true);save()}render()});
  v.querySelectorAll('[data-watch]').forEach(b=>b.onclick=()=>{filter='watch';q='';go('stock')});
  v.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{detailId=b.dataset.open;screen='detail';bellOpen=false;render();v.scrollTop=0});
  v.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>{screen=null;render()});
  v.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});
  const qi=$('#q'); if(qi) qi.oninput=e=>{q=e.target.value;const p=e.target.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(p,p)};

  if(screen==='add'){
    v.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{form.type=b.dataset.type;if(form.type==='consommable'&&form.cat==='chaussures')form.cat='nutrition';render()});
    v.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{form.cat=b.dataset.cat;render()});
    const map={'f-name':'name','f-brand':'brand','f-date':'date','f-price':'price','f-life':'life','f-qty':'qty'};
    Object.entries(map).forEach(([id,k])=>{const el=document.getElementById(id);if(!el)return;
      el.oninput=e=>{form[k]=e.target.value;if(k==='name'){const b=$('#save');b.disabled=!form.name.trim();const h=b.parentNode.querySelector('.hint');if(h)h.style.display=form.name.trim()?'none':''}}});
    $('#save').onclick=()=>{
      if(!form.name.trim())return;
      const it={id:uid(),type:form.type,cat:form.cat,name:form.name.trim(),brand:form.brand.trim(),date:form.date,price:parseFloat(form.price)||0,fav:false,added:Date.now()};
      if(form.type==='equipement'){it.life=Math.max(1,parseInt(form.life)||800);it.used=0}else{it.qty=Math.max(1,parseInt(form.qty)||1);it.qtyMax=it.qty}
      S.items.unshift(it);save();screen=null;tab='stock';filter='all';q='';prep=null;render();toast('Ajouté à ton inventaire');
    };
  }
  if(screen==='detail'){
    const i=S.items.find(x=>x.id===detailId);
    v.querySelectorAll('[data-km]').forEach(b=>b.onclick=()=>{const bf=alertKeys();addKm(i,Number(b.dataset.km));save();render();toast(`+${b.dataset.km} km enregistrés`);notifyNew(bf)});
    v.querySelectorAll('[data-qty]').forEach(b=>b.onclick=()=>{i.qty=Math.max(0,i.qty+Number(b.dataset.qty));i.qtyMax=Math.max(qMax(i),i.qty);save();render()});
    const gb=v.querySelector('[data-giveback]'); if(gb) gb.onclick=()=>{
      const used=Math.floor(i.used||0);
      if(used<=0){toast('Aucun km à rajouter pour le moment');return}
      askNumber({icon:'undo',title:'Rajouter des km',text:`Les km saisis sont retirés des km parcourus de « ${i.name} » : la barre de vie remonte d’autant. Maximum : ${used} km.`,unit:'km',chips:[5,10,20].filter(c=>c<=used),max:used,ok:'Rajouter',
        onOk:n=>{n=Math.min(n,used);i.used=(i.used||0)-n;(i.log=i.log||[]).push({t:Date.now(),km:-n});if(i.log.length>50)i.log.splice(0,i.log.length-50);pruneSeen();save();render();toast(`${n} km rajoutés à la durée de vie`)}});
    };
    const fv=v.querySelector('[data-fav]'); if(fv) fv.onclick=()=>{i.fav=!i.fav;save();render()};
    const dl=v.querySelector('[data-del]'); if(dl) dl.onclick=()=>askConfirm('Supprimer ce matériel ?',`« ${i.name} » sera supprimé définitivement de ton inventaire.`,'Supprimer',()=>{S.items=S.items.filter(x=>x.id!==i.id);save();screen=null;prep=null;render();toast('Élément supprimé')});
  }
  if(tab==='prep'&&!screen&&S.items.length){
    v.querySelectorAll('[data-sel]').forEach(c=>c.onchange=()=>{c.checked?prep.sel.add(c.dataset.sel):prep.sel.delete(c.dataset.sel)});
    const km=$('#p-km'); if(km) km.oninput=e=>{prep.km=parseFloat(e.target.value)||0};
    const fin=$('#finish'); if(fin) fin.onclick=()=>{
      if(!(prep.km>0)){toast('Indique une distance');return}
      const bf=alertKeys();
      S.items.forEach(i=>{if(!prep.sel.has(i.id))return;if(i.type==='equipement')addKm(i,prep.km);else i.qty=Math.max(0,i.qty-1)});
      save();prep=null;toast('Sortie enregistrée');render();notifyNew(bf);
    };
  }
  if(tab==='me'&&!screen){
    $('#p-name').oninput=e=>{S.profile.name=e.target.value;save();const a=document.querySelector('.avatar');if(a)a.textContent=(e.target.value.trim()[0]||'?').toUpperCase()};
    $('#p-sport').oninput=e=>{S.profile.sport=e.target.value;save()};
    $('#sw').onclick=()=>{S.alerts=!S.alerts;save();render()};
    $('#about').onclick=()=>{aboutOpen=!aboutOpen;render()};
    $('#export').onclick=exportData;
    $('#import').onclick=()=>$('#importFile').click();
    $('#importFile').onchange=e=>importData(e.target.files[0]);
    $('#reset').onclick=()=>askConfirm('Réinitialiser tes données ?','Tout ton matériel et ton profil seront effacés. Cette action est définitive.','Réinitialiser',()=>{S=JSON.parse(JSON.stringify(DEF));save();prep=null;render();toast('Données réinitialisées')});
  }
}

async function exportData(){
  const txt=JSON.stringify(S,null,2), name='gearlife-sauvegarde-'+new Date().toISOString().slice(0,10)+'.json';
  try{
    const file=new File([txt],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Sauvegarde Gearlife'});toast('Sauvegarde prête');return}
  }catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=name;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast('Sauvegarde téléchargée');
}
function importData(f){
  if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{
    const d=JSON.parse(r.result);
    if(!d||!Array.isArray(d.items))throw 0;
    askConfirm('Remplacer tes données ?','Tes données actuelles seront remplacées par cette sauvegarde.','Remplacer',()=>{S=Object.assign({},DEF,d,{items:d.items,profile:Object.assign({},DEF.profile,d.profile)});
    save();prep=null;render();toast('Données importées');});
  }catch(e){toast('Fichier de sauvegarde invalide')}};
  r.readAsText(f);
}
try{ if(navigator.storage&&navigator.storage.persist)navigator.storage.persist() }catch(e){}
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
render();
(function(){
  try{
    const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
    const standalone=navigator.standalone||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches);
    if(!ios||standalone||localStorage.getItem('gearflow.tip'))return;
    const t=document.createElement('div');t.className='ios-tip';t.setAttribute('role','note');
    t.innerHTML='<div>Pour installer Gearlife : dans <b>Safari</b>, touche <b>Partager</b> (le carré avec la flèche), puis <b>« Sur l’écran d’accueil »</b>.</div><button aria-label="Fermer">OK</button>';
    t.querySelector('button').onclick=()=>{t.remove();try{localStorage.setItem('gearflow.tip','1')}catch(e){}};
    document.getElementById('app').appendChild(t);
  }catch(e){}
})();
</script>
